worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    error_log /dev/null;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    open_file_cache off;
    etag off;
    if_modified_since off;
    max_ranges 0;
    gzip off;
    default_type text/yaml;
    charset utf-8;
    charset_types text/yaml;

    # Strict raw URI check precedes normalized location matching. Queries are
    # intentionally not accepted in v1; generated links contain none.
    map $request_uri $canonical_path {
        default 0;
        "~^/s/[0-9a-f]{64}/profile\.yaml$" 1;
    }
    map $request_method $read_method {
        default 0;
        GET 1;
        HEAD 1;
    }
    server {
        listen 8080 default_server;
        server_name _;
        error_page 400 403 405 =404 /__not_found__;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($canonical_path = 0) { return 404; }
        if ($read_method = 0) { return 404; }
        location ~ "^/s/(?<subscription_token>[0-9a-f]{64})/profile\.yaml$" {
            alias /published/$subscription_token.yaml;
            autoindex off;
            disable_symlinks on;
        }
        location / { return 404; }
        location = /__not_found__ { internal; return 404; }
    }
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        location = /healthz { return 204; }
        location / { return 404; }
    }
}
