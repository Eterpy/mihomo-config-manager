name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Check public source and Git index
        run: |
          python scripts/check_public.py
          python scripts/check_public.py --staged
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -m 'not container' -p no:cacheprovider
      - name: Check syntax and dependencies
        run: |
          python -m pip check
          node --check app/static/app.js
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Build source archive
        run: python scripts/package_release.py "$RUNNER_TEMP/mihomo-config-manager-source.tar.gz"
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated container tests
        run: sh scripts/test-containers.sh
