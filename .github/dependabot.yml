version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  # requirements*.in are compiled by pip-tools; lock files keep their hashes.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  # Nginx image in compose.yaml and compose.test.yaml must stay identical.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Built locally from the Dockerfile; not published to any registry.
      - dependency-name: mihomo-config-manager-admin
      - dependency-name: mihomo-config-manager-test
