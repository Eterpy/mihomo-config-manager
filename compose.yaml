name: yaml-config-manager
services:
  admin:
    build:
      context: .
      target: production
    image: yaml-config-manager-admin:0.4.0
    user: "10001:10001"
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
  public:
    image: nginx/nginx-unprivileged:1.30.8-alpine3.24@sha256:637c35e46af7bc0dd3d3bcf7162e004e13ab3b370fde7cd416e2ac410b5a985a
    user: "101:101"
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - type: bind
        source: ./data/published
        target: /published
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}
